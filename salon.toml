# Glow Studio — Front Desk config
# The owner fills this in once. Rules live here; the owner never edits a prompt.

[business]
name = "Glow Studio"
timezone = "America/Los_Angeles"
transfer_phone = "+14155550132"

[calendar]
provider = "local"          # local | google (google adapter binds later)
calendar_id = "primary"

[hours.weekly]
mon = []
tue = [["09:00","19:00"]]
wed = [["09:00","19:00"]]
thu = [["09:00","19:00"]]
fri = [["09:00","19:00"]]
sat = [["09:00","17:00"]]
sun = []

[hours.overrides]
"2026-12-25" = []
"2026-11-26" = []

[[services]]
id = "haircut"
name = "Haircut"
duration_min = 45
buffer_after_min = 10

[[services]]
id = "color"
name = "Full color"
duration_min = 120
buffer_after_min = 15

[[services]]
id = "beard-trim"
name = "Beard trim"
duration_min = 20

[policy]
min_notice_min = 60
max_advance_days = 30
slot_increment_min = 15
hold_ttl_min = 10

[reminders]
confirm = "sms"
remind_before_min = [1440]

[escalation]
max_retries = 2
transfer_on = ["no_availability", "ambiguous_request", "vip_request"]
